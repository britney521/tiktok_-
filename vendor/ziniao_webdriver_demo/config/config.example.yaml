ziniao:
  # 浏览器配置
  browser:
    # 浏览器版本 v5 或 v6
    version: v6
    # 客户端程序路径。**留空即可**，程序会自动去找。
    #   留空            → 自动探测（环境变量 ZINIAO_EXE_PATH → 运行中的进程 →
    #                     注册表 → 常见安装目录 → 盘根浅扫）
    #   Windows         → 填 exe 全路径（D:\紫鸟\ziniao\ziniao.exe），
    #                     填它所在的目录（D:\紫鸟\ziniao）也行。
    #                     注意：Windows 的安装目录是安装时自选的，没有固定位置，
    #                     官方 demo 示例里的 D:\ziniao\ziniao.exe 只是其中一种。
    #                     填错了也不要紧，会自动回落到自动探测。
    #                     另：资源管理器默认隐藏扩展名，从快捷方式属性抄来的
    #                     「D:\紫鸟\ziniao」其实是个 exe —— 这种写法也认（会自动补 .exe）。
    #   macOS           → ziniao 或 /Applications/ziniao.app
    #   Linux           → /opt/ziniao/ziniaobrowser
    # ⚠️ 这一项是「客户端程序」，别和下面的「数据目录」搞混。
    client_path: ''
    # 已改用原生 CDP 接管浏览器，无需 chromedriver，此项保留仅为兼容旧配置
    webdriver_path: ''
    # 浏览器 socket 端口，取系统未被占用的端口
    socket_port: 16851
    # 【v6 必填】web_driver 实例专用的 user-data-dir（**留空即可**，会自动推导）。
    # ⚠️ 这是「文件夹」，别把客户端 exe 填到这里（误填会被自动忽略并回退默认值）。
    # 不带它时客户端只会把请求转给 GUI 实例，永远不创建 HTTP IPC 端口，
    # 表现为「启动环境后卡住 / 获取店铺列表失败」。留空则自动推导到
    #   macOS   ~/Library/Application Support/ziniaobrowser/instances/ziniao_webdriver
    #   Windows %LOCALAPPDATA%\ziniaobrowser\instances\ziniao_webdriver
    #   Linux   ~/.config/ziniaobrowser/instances/ziniao_webdriver
    user_data_dir: ''

  # 企业登录的用户信息 —— 请填你自己的账号，不要提交到仓库
  user_info:
    company: ''
    username: ''
    password: ''

# 本项目不使用这些任务，保留段位仅为了跟紫鸟原生 config.yaml 兼容
task:
  thread_num: 3
  amazon: []
